apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

// Host for https invite links (https://<host>/join/<CODE>), read from INVITE_LINK_BASE_URL in ../.env
def inviteHost = "invalid.syncpoint.local"
def envFile = rootProject.file("../.env")
if (envFile.exists()) {
    envFile.eachLine { line ->
        def match = (line =~ /^\s*INVITE_LINK_BASE_URL\s*=\s*(\S+)/)
        if (match.find()) {
            try {
                def host = new URI(match.group(1)).host
                if (host) inviteHost = host
            } catch (ignored) {
            }
        }
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.syncpoint"
    defaultConfig {
        applicationId "com.syncpoint"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        manifestPlaceholders = [inviteHost: inviteHost]
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release signing comes from the environment / ~/.gradle/gradle.properties, never from the repo:
        //   SYNCPOINT_KEYSTORE_FILE, SYNCPOINT_KEYSTORE_PASSWORD, SYNCPOINT_KEY_ALIAS, SYNCPOINT_KEY_PASSWORD
        release {
            def keystorePath = System.getenv("SYNCPOINT_KEYSTORE_FILE") ?: project.findProperty("SYNCPOINT_KEYSTORE_FILE")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("SYNCPOINT_KEYSTORE_PASSWORD") ?: project.findProperty("SYNCPOINT_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SYNCPOINT_KEY_ALIAS") ?: project.findProperty("SYNCPOINT_KEY_ALIAS")
                keyPassword System.getenv("SYNCPOINT_KEY_PASSWORD") ?: project.findProperty("SYNCPOINT_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            } else {
                // Local convenience only: a release build without a real keystore is NOT publishable.
                logger.warn("WARNING: SYNCPOINT_KEYSTORE_FILE not set - signing release build with the debug key.")
                signingConfig signingConfigs.debug
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    // AndroidX & Kotlin Coroutines
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0")

    // Google Play Services Fused Location (Foreground Service)
    implementation("com.google.android.gms:play-services-location:21.2.0")

    // Firebase Android SDKs
    implementation(platform("com.google.firebase:firebase-bom:33.9.0"))
    implementation("com.google.firebase:firebase-database-ktx")
    implementation("com.google.firebase:firebase-auth-ktx")
    implementation("com.google.firebase:firebase-messaging-ktx")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Apply Google Services plugin if google-services.json is present
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
